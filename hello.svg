<svg width="40" height="60" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo transparente para herdar o tema do GitHub -->
  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Texto preto com contorno para visibilidade -->
  <text x="0" y="40" font-family="Courier New" font-size="14" fill="black" stroke="black" stroke-width="0.5">
    Hello World
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </text>
</svg>






